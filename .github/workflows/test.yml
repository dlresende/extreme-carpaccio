name: Test

on:
  pull_request:

jobs:
  server-linux:
    name: Server (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm install && npm run lint && npm test
        working-directory: server

  server-windows:
    name: Server (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm install && npm run lint && npm test
        working-directory: server

  client-js-express:
    name: Client JS (Express)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: clients/javascript/express/package-lock.json
      - run: npm install && npm test
        working-directory: clients/javascript/express

  client-js-node-plain:
    name: Client JS (Node Plain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: clients/javascript/node-plain/package-lock.json
      - run: npm install && npm test
        working-directory: clients/javascript/node-plain

  client-ts:
    name: Client TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: clients/typescript/package-lock.json
      - run: npm install && npm test
        working-directory: clients/typescript

  client-python-flask:
    name: Client Python (Flask)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
      - run: pip install -r requirements.txt && python -m unittest discover -s tests
        working-directory: clients/python/flask-server

  client-python-simple:
    name: Client Python (Simple)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s tests
        working-directory: clients/python/simple-server

  client-go:
    name: Client Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'clients/go/go.mod'
          cache-dependency-path: clients/go/go.mod
      - run: go test -v ./...
        working-directory: clients/go

  client-rust:
    name: Client Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: clients/rust

  client-java-httpserver:
    name: Client Java (JDK HTTP Server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: clients/java/java-httpserver/pom.xml
      - run: mvn test
        working-directory: clients/java/java-httpserver

  client-java-spark:
    name: Client Java (Spark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: clients/java/java-spark/pom.xml
      - run: mvn test
        working-directory: clients/java/java-spark

  client-java-springboot:
    name: Client Java (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: clients/java/java-springboot/pom.xml
      - run: mvn test
        working-directory: clients/java/java-springboot

  client-kotlin:
    name: Client Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
        working-directory: clients/kotlin

  client-scala:
    name: Client Scala
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - run: sbt test
        working-directory: clients/scala

  client-groovy:
    name: Client Groovy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
        working-directory: clients/groovy

  client-csharp:
    name: Client C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test extreme-carpaccio-client-csharp.sln
        working-directory: clients/c#

  client-fsharp:
    name: Client F#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test extreme-carpaccio-client-fsharp.sln
        working-directory: clients/f#

  client-ruby-rails:
    name: Client Ruby (Rails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: clients/ruby/ruby-rails
      - run: bin/rails test
        working-directory: clients/ruby/ruby-rails

  client-ruby-sinatra:
    name: Client Ruby (Sinatra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: clients/ruby/sinatra
      - run: bundle exec rake test
        working-directory: clients/ruby/sinatra

  client-php:
    name: Client PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress
        working-directory: clients/php
      - run: composer test
        working-directory: clients/php

  client-clojure:
    name: Client Clojure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: lein test
        working-directory: clients/clojure

  ci-gate:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs:
      - server-linux
      - server-windows
      - client-js-express
      - client-js-node-plain
      - client-ts
      - client-python-flask
      - client-python-simple
      - client-go
      - client-rust
      - client-java-httpserver
      - client-java-spark
      - client-java-springboot
      - client-kotlin
      - client-scala
      - client-groovy
      - client-csharp
      - client-fsharp
      - client-ruby-rails
      - client-ruby-sinatra
      - client-php
      - client-clojure
    if: always()
    steps:
      - name: Verify all required test jobs succeeded
        run: |
          if [ "${{ needs.server-linux.result }}" != "success" ] || \
             [ "${{ needs.server-windows.result }}" != "success" ] || \
             [ "${{ needs.client-js-express.result }}" != "success" ] || \
             [ "${{ needs.client-js-node-plain.result }}" != "success" ] || \
             [ "${{ needs.client-ts.result }}" != "success" ] || \
             [ "${{ needs.client-python-flask.result }}" != "success" ] || \
             [ "${{ needs.client-python-simple.result }}" != "success" ] || \
             [ "${{ needs.client-go.result }}" != "success" ] || \
             [ "${{ needs.client-rust.result }}" != "success" ] || \
             [ "${{ needs.client-java-httpserver.result }}" != "success" ] || \
             [ "${{ needs.client-java-spark.result }}" != "success" ] || \
             [ "${{ needs.client-java-springboot.result }}" != "success" ] || \
             [ "${{ needs.client-kotlin.result }}" != "success" ] || \
             [ "${{ needs.client-scala.result }}" != "success" ] || \
             [ "${{ needs.client-groovy.result }}" != "success" ] || \
             [ "${{ needs.client-csharp.result }}" != "success" ] || \
             [ "${{ needs.client-fsharp.result }}" != "success" ] || \
             [ "${{ needs.client-ruby-rails.result }}" != "success" ] || \
             [ "${{ needs.client-ruby-sinatra.result }}" != "success" ] || \
             [ "${{ needs.client-php.result }}" != "success" ] || \
             [ "${{ needs.client-clojure.result }}" != "success" ]; then
            echo "One or more test jobs failed."
            exit 1
          fi
          echo "All test jobs passed successfully!"
