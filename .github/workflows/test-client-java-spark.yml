name: Client Java (Spark)

on:
  pull_request:
    paths:
      - 'clients/java/java-spark/**'
      - '.github/workflows/**'
      - '.github/actions/**'

jobs:
  client-java-spark:
    name: Client Java (Spark)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
        cache-dependency-path: clients/java/java-spark/pom.xml
    - run: mvn test
      working-directory: clients/java/java-spark
