name: Client Kotlin

on:
  pull_request:
    paths:
      - 'clients/kotlin/**'
      - '.github/workflows/**'
      - '.github/actions/**'

jobs:
  client-kotlin:
    name: Client Kotlin
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
    - run: "./gradlew test"
      working-directory: clients/kotlin
